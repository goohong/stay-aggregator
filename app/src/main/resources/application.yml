spring:
  application:
    name: stay-aggregator
  threads:
    virtual:
      # 요청 처리 스레드가 공급사 응답을 block 으로 기다리는 동안 OS 스레드를 붙잡지 않는다 (ADR-0021)
      enabled: true

# 지표와 상태만 연다. 경보·대시보드는 이 저장소 범위 밖이다 (ADR-0060)
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

stay:
  # 공급사마다 주소·인증 키를 설정 블록 하나에 두고 (ADR-0038), 타임아웃도 같은 자리에 둔다 (ADR-0039).
  # 저장소에는 Mock 을 가리키는 값만 둔다. 실제 값은 환경 변수로 덮어쓴다.
  # 예: STAY_SUPPLIERS_A_BASEURL, STAY_SUPPLIERS_A_APIKEY
  suppliers:
    a:
      base-url: http://localhost:9090
      api-key: mock
      timeout: PT30S
      # 재고·요금 호출 하나의 한계. 아직 측정 전 임시값이다. Mock 지연 모드로 재서 정하고 ADR 에 근거를 적는다 (ADR-0045)
      availability-timeout: PT5S
      # 연결 수립만 기다리는 한계. AWS SDK 의 standard 모드 기본값을 따랐다 (ADR-0066)
      connect-timeout: PT3.1S
    b:
      base-url: http://localhost:9090
      api-key: mock
      timeout: PT30S
      availability-timeout: PT5S
      connect-timeout: PT3.1S

  search:
    # 검색 전체 타임아웃과 공급사당 동시 호출 수. 둘 다 측정 전 임시값이다 (ADR-0045)
    timeout: PT8S
    concurrency-per-supplier: 4
    # 일시적인 실패만 재시도한다 (ADR-0051). 시도 세 번(= 재시도 2회)은 Google SRE 를 따랐고
    # 대기 시간 둘은 아직 임시값이다.
    max-retries: 2
    retry-min-backoff: PT0.1S
    retry-max-backoff: PT1S
    # 반복해서 실패하는 공급사를 한동안 호출하지 않는다 (ADR-0056). 모두 임시값이다.
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-number-of-calls: 10
      wait-duration-in-open-state: PT30S
      permitted-number-of-calls-in-half-open-state: 3

  quarantine:
    # 마지막으로 본 지 이만큼 지난 격리 기록은 목록 동기화 때 지운다 (ADR-0055). 임시값이다
    retention: P30D

  # 목록 동기화는 기동 직후 한 번 돌고, 그 뒤로는 앞선 실행이 끝난 시점부터 주기를 잰다 (ADR-0013, ADR-0016).
  # 기본값은 CatalogSyncScheduler 에 있다. 바꾸려면 stay.catalog.sync.initial-delay 와 interval 을 여기에 적는다.
  # stay.catalog.sync.enabled 를 false 로 두면 동기화를 돌리지 않는다.
