spring:
  application:
    name: stay-aggregator
  threads:
    virtual:
      # 요청 처리 스레드가 공급사 응답을 block 으로 기다리는 동안 OS 스레드를 붙잡지 않는다 (ADR-0021)
      enabled: true

# 지표와 상태만 연다. 경보·대시보드는 이 저장소 범위 밖이다 (ADR-0060)
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

stay:
  # 공급사마다 주소·인증 키를 설정 블록 하나에 두고 (ADR-0038), 타임아웃도 같은 설정 블록에 둔다 (ADR-0039).
  # 저장소에는 Mock 을 가리키는 값만 둔다. 실제 값은 환경 변수로 덮어쓴다.
  # 예: STAY_SUPPLIERS_A_BASEURL, STAY_SUPPLIERS_A_APIKEY
  suppliers:
    a:
      base-url: http://localhost:9090
      api-key: mock
      timeout: PT30S
      # 재고·요금 호출 타임아웃. 시도 세 번과 그 사이 대기가 검색 전체 타임아웃 안에 여유를 두고 들어가게 했다.
      # 3 × 2s + 대기 최대 0.45s = 6.45s ≤ 8s, 남은 1.5s 는 매핑 읽기 같은 앞 단계 몫이다 (ADR-0068)
      availability-timeout: PT2S
      # 연결 타임아웃. 연결 수립에만 건다. AWS SDK in-region 모드 기본값 1100ms 이고 호출 타임아웃보다 짧아야 한다 (ADR-0066, ADR-0068)
      connect-timeout: PT1.1S
    b:
      base-url: http://localhost:9090
      api-key: mock
      timeout: PT30S
      availability-timeout: PT2S
      connect-timeout: PT1.1S

  search:
    # 검색 전체 타임아웃. Nielsen 의 "주의를 붙잡아 두는 한계" 10초에서 네트워크·화면 몫 2초를 뺐다(2초는 판단값) (ADR-0068)
    timeout: PT8S
    # 공급사당 동시 호출 수. 공급사 하나에 한꺼번에 보내는 호출 수를 제한하는 판단값이다 (ADR-0045, ADR-0068)
    concurrency-per-supplier: 4
    # 5xx·연결 실패만 재시도한다 (ADR-0051). 시도 세 번(= 재시도 2회)은 Google SRE 를 따랐다.
    # 설정 객체가 "호출 타임아웃 × 시도 수 + 대기 최대치 < 검색 전체 타임아웃" 을 검사한다 (ADR-0068)
    retry:
      max-retries: 2
      min-backoff: PT0.1S
      max-backoff: PT1S
    # 요청 한도 초과(429·E429). AWS SDK 의 throttling 기준 대기 1초를 따랐고, 2s × 2 + 1.5s = 5.5s 라 한 번만 재시도한다.
    # 최대 백오프 1.5초는 무작위(0.5)가 잘리지 않는 값이다 (ADR-0068)
    throttled-retry:
      max-retries: 1
      min-backoff: PT1S
      max-backoff: PT1.5S
    # 반복해서 실패하는 공급사를 한동안 호출하지 않는다 (ADR-0056). 값마다 근거와 관계식은 ADR-0068 에 있다
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      # 동시 호출 수의 두 배. 응답 없는 공급사면 검색 두 건에 열린다(판단값)
      minimum-number-of-calls: 8
      # Envoy·Istio 의 기본 차단 시간 30초
      wait-duration-in-open-state: PT30S
      # 동시 호출 수와 같게 둔다. 적으면 반열림 상태의 검색에서 첫 chunk 일부가 거절된다
      permitted-number-of-calls-in-half-open-state: 4

  quarantine:
    # 마지막으로 본 지 이만큼 지난 격리 기록은 목록 동기화 때 지운다 (ADR-0055).
    # 운영자가 한 달에 한 번은 본다는 가정의 판단값이다 (ADR-0068)
    retention: P30D
    # 쓰기를 기다리는 묶음(검색 한 건이 낸 항목들)의 상한. 쓰기 스레드 하나가 초당 수백 행을 쓰므로 1,000 묶음이면
    # 공급사 하나가 형식을 통째로 바꾼 상황에서도 수 분을 버틴다(판단값). 넘으면 버리고 경고와 지표로 남긴다 (ADR-0073)
    queue-capacity: 1000

  # 목록 동기화는 기동 직후 한 번 돌고, 그 뒤로는 앞선 실행이 끝난 시점부터 주기를 잰다 (ADR-0013, ADR-0016).
  # 기본값은 CatalogSyncScheduler 에 있다. 바꾸려면 stay.catalog.sync.initial-delay 와 interval 을 여기에 적는다.
  # stay.catalog.sync.enabled 를 false 로 두면 동기화를 돌리지 않는다.
