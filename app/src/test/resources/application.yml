# 테스트에서 쓰는 값이다. 타임아웃만 짧게 두어 타임아웃 동작을 빨리 확인한다.
# 운영 값은 app/src/main/resources/application.yml 에 있다 (ADR-0039).
stay:
  suppliers:
    a:
      base-url: http://localhost:9090
      api-key: test
      timeout: PT1S
      availability-timeout: PT0.5S
      connect-timeout: PT0.25S
    b:
      base-url: http://localhost:9090
      api-key: test
      timeout: PT1S
      availability-timeout: PT0.5S
      connect-timeout: PT0.25S
  search:
    timeout: PT2S
    concurrency-per-supplier: 4
    # 테스트는 기다림을 짧게 둔다
    # 시도 세 번이 검색 전체 타임아웃 안에 들어가야 설정이 만들어진다 (ADR-0068)
    retry:
      max-retries: 2
      min-backoff: PT0.01S
      max-backoff: PT0.05S
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 4
      minimum-number-of-calls: 4
      wait-duration-in-open-state: PT1S
      permitted-number-of-calls-in-half-open-state: 1
  quarantine:
    retention: P30D
